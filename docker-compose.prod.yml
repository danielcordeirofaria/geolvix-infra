# docker-compose.prod.yml — Produção
#
# Usa imagens publicadas no GitHub Container Registry (GHCR) em vez de build local.
# As imagens são publicadas automaticamente pelo CI de cada repo ao fazer push na main.
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d
#
# Variáveis obrigatórias (definir no servidor ou via GitHub Actions secrets):
#   REGISTRY_OWNER     → seu usuário/org do GitHub (ex: danielcordeirofaria)
#   IMAGE_TAG          → tag da imagem (padrão: latest)
#   POSTGRES_PASSWORD
#   JWT_SECRET
#   MAIL_PASSWORD
#   INTERNAL_API_TOKEN
#   ASAAS_API_KEY
#   ASAAS_WEBHOOK_TOKEN

version: '3.8'

x-image-defaults: &registry
  REGISTRY_OWNER: ${REGISTRY_OWNER:?Defina REGISTRY_OWNER com seu usuario GitHub}
  IMAGE_TAG: ${IMAGE_TAG:-latest}

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: geolvix-db
    restart: always
    environment:
      POSTGRES_USER: geolvix_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: geolvix_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migration/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
      - ./db/migration/002_soft_delete_usuarios.sql:/docker-entrypoint-initdb.d/002_soft_delete_usuarios.sql
      - ./db/migration/003_cloud_coverage.sql:/docker-entrypoint-initdb.d/003_cloud_coverage.sql
      - ./db/migration/004_eudr_dds_fields.sql:/docker-entrypoint-initdb.d/004_eudr_dds_fields.sql
      - ./db/migration/005_commodity_per_analise.sql:/docker-entrypoint-initdb.d/005_commodity_per_analise.sql
      - ./db/migration/006_soft_delete_propriedades.sql:/docker-entrypoint-initdb.d/006_soft_delete_propriedades.sql
      - ./db/migration/007_usuario_dados_contato.sql:/docker-entrypoint-initdb.d/007_usuario_dados_contato.sql
      - ./db/migration/008_senha_temporaria.sql:/docker-entrypoint-initdb.d/008_senha_temporaria.sql
      - ./db/migration/009_asaas_customer_id.sql:/docker-entrypoint-initdb.d/009_asaas_customer_id.sql
    networks:
      - geolvix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geolvix_user -d geolvix_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: geolvix-redis
    restart: always
    volumes:
      - redisdata:/data
    networks:
      - geolvix-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gis-ingestion:
    image: ghcr.io/${REGISTRY_OWNER}/geolvix-gis-ingestion:${IMAGE_TAG:-latest}
    container_name: geolvix-gis-ingestion
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://geolvix_user:${POSTGRES_PASSWORD}@db:5432/geolvix_db
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
    ports:
      - "8001:8001"
    networks:
      - geolvix-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/api/v1/gis/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  core:
    image: ghcr.io/${REGISTRY_OWNER}/geolvix-core:${IMAGE_TAG:-latest}
    container_name: geolvix-core
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/geolvix_db
      SPRING_DATASOURCE_USERNAME: geolvix_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?}
      GEOLVIX_JWT_SECRET: ${JWT_SECRET:?}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:?}
      GEOLVIX_SATELLITE_CALLBACK_TOKEN: ${INTERNAL_API_TOKEN:?}
      GEOLVIX_ASAAS_API_KEY: ${ASAAS_API_KEY:?}
      GEOLVIX_ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:?}
      GEOLVIX_SATELLITE_WORKER_URL: http://satellite-worker:8002
      GEOLVIX_GIS_INGESTION_URL: http://gis-ingestion:8001
    # Core não expõe porta diretamente — tráfego passa pelo nginx
    networks:
      - geolvix-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    container_name: geolvix-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - geolvix-network
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && curl -sf http://localhost/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  satellite-worker:
    image: ghcr.io/${REGISTRY_OWNER}/geolvix-satellite-worker:${IMAGE_TAG:-latest}
    container_name: geolvix-satellite-worker
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      CORE_SERVICE_URL: http://core:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      IMAGE_PROVIDER: bdc
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - satellite-storage:/app/storage
    ports:
      - "8002:8002"
    networks:
      - geolvix-network
    depends_on:
      redis:
        condition: service_healthy
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/api/v1/internal/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  satellite-storage:
    driver: local

networks:
  geolvix-network:
    driver: bridge
