# ─── Geolvix — nginx reverse proxy com rate limiting ─────────────────────────
#
# Camadas de proteção:
#   1. login/registro: 5 req/min por IP (anti força-bruta)
#   2. API geral:     60 req/s  por IP (anti DoS)
#   3. Webhook Asaas: sem limite (chamado pelo Asaas, não usuário)
#
# O Core Service (porta 8080) nunca é exposto diretamente —
# todo tráfego externo passa por este nginx.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ── Zonas de rate limiting (armazenadas na memória compartilhada) ──────────
    # 10m ≈ suporta ~160.000 IPs simultâneos
    limit_req_zone $binary_remote_addr zone=auth:10m     rate=5r/m;   # login/registro
    limit_req_zone $binary_remote_addr zone=api:10m      rate=60r/s;  # API geral
    limit_req_zone $binary_remote_addr zone=webhook:10m  rate=30r/s;  # webhooks externos

    # Resposta padrão quando o limite é excedido
    limit_req_status 429;

    # Log de requisições bloqueadas para auditoria
    log_format rate_limit '$remote_addr [$time_local] "$request" $status '
                          'limit_req_status=$limit_req_status';

    server {
        listen 80;
        server_name _;

        # Cabeçalhos de segurança globais
        add_header X-Frame-Options        "DENY"            always;
        add_header X-Content-Type-Options "nosniff"         always;
        add_header X-XSS-Protection       "1; mode=block"   always;
        add_header Referrer-Policy        "no-referrer"     always;

        # ── Login e Registro: limite estrito ──────────────────────────────────
        # burst=3: permite 3 req extras em espera antes de rejeitar
        # nodelay: rejeita imediatamente após burst (sem enfileirar com delay)
        location ~ ^/api/v1/auth/(login|registro)$ {
            limit_req zone=auth burst=3 nodelay;
            limit_req_log_level warn;

            proxy_pass         http://core:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Webhooks externos (Asaas): sem limite de usuário, mas limitado por IP ─
        location /api/v1/webhooks/ {
            limit_req zone=webhook burst=10 nodelay;

            proxy_pass         http://core:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── API geral ────────────────────────────────────────────────────────
        location / {
            limit_req zone=api burst=80 nodelay;

            proxy_pass         http://core:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeouts conservadores para MVP
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    60s;
        }

        # ── Resposta 429 customizada ──────────────────────────────────────────
        error_page 429 @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error":"Muitas requisições. Aguarde e tente novamente.","status":429}';
        }
    }
}
